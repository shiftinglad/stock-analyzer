<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股投资分析工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header h1{font-size:18px;font-weight:600}
.header .subtitle{font-size:12px;opacity:.7}
.nav{display:flex;gap:8px;background:#fff;padding:10px 16px;border-bottom:1px solid #e0e0e0;overflow-x:auto}
.nav button{padding:8px 16px;border:1px solid #ddd;border-radius:20px;background:#f8f9fa;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s}
.nav button.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.container{max-width:800px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-title{font-size:16px;font-weight:600;color:#1a1a2e}
.card-meta{font-size:12px;color:#888}
.card-category{display:inline-block;background:#e8edf5;color:#1a1a2e;padding:2px 10px;border-radius:12px;font-size:12px;margin-left:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-blue{background:#dbeafe;color:#1d4ed8}.badge-red{background:#fee2e2;color:#dc2626}
.badge-green{background:#dcfce7;color:#16a34a}.badge-yellow{background:#fef9c3;color:#a16207}
.badge-purple{background:#f3e8ff;color:#7c3aed}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:#555}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#1a1a2e}
.form-group textarea{resize:vertical;min-height:80px}
.btn{padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s}
.btn-primary{background:#1a1a2e;color:#fff;width:100%}.btn-primary:hover{background:#2a2a4e}
.btn-danger{background:#fee2e2;color:#dc2626;padding:6px 12px;font-size:12px}
.btn-edit{background:#dbeafe;color:#1d4ed8;padding:6px 12px;font-size:12px}
.btn-sm{padding:6px 12px;font-size:13px}
.search-row{display:flex;gap:8px}.search-row input{flex:1}
.search-row button{padding:10px 16px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
.search-results{background:#f8f9fa;border-radius:8px;padding:8px;margin-bottom:16px}
.search-results select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px}
.info-box{background:#f0f4ff;border-left:3px solid #1a1a2e;border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.7;color:#444}
.info-box h4{color:#1a1a2e;margin-bottom:4px;font-size:14px}
.detail-section{margin-bottom:12px}.detail-section h4{font-size:13px;color:#888;margin-bottom:4px}
.detail-section p{font-size:14px;line-height:1.6;white-space:pre-wrap}
.empty{text-align:center;padding:40px 20px;color:#999}.empty .icon{font-size:48px;margin-bottom:12px}
.stats{display:flex;gap:12px;margin-bottom:16px}
.stat-card{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat-num{font-size:24px;font-weight:700;color:#1a1a2e}.stat-label{font-size:12px;color:#888}
.filters select{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.actions{display:flex;gap:8px;margin-top:8px}
.loading{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:#1a1a2e;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <h1>📊 A股投资分析</h1>
  <div class="subtitle">个人投资分析工具</div>
</div>
<div class="nav" id="nav"></div>
<div class="container" id="main"></div>

<script src="stocks.js?v=2"></script>
<script>
var DB_KEY='stock_analysis_data',CATS_KEY='stock_categories',DEFAULT_CATS=['核心资产','高股息','科技成长','周期股','观察仓'];
var CAT_COLORS={'核心资产':'blue','高股息':'green','科技成长':'purple','周期股':'yellow','观察仓':'red'};
function loadData(){try{return JSON.parse(localStorage.getItem(DB_KEY)||'[]')}catch(e){return[]}}
function saveData(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
function loadCats(){try{var c=JSON.parse(localStorage.getItem(CATS_KEY));return c&&c.length?c:DEFAULT_CATS}catch(e){return DEFAULT_CATS}}
function saveCats(c){localStorage.setItem(CATS_KEY,JSON.stringify(c))}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}

var currentPage='add',editingCode=null;

function render(){
  document.getElementById('nav').innerHTML=
    [{id:'add',label:'📝 新增'},{id:'pool',label:'📂 股票池'},{id:'all',label:'📋 全部记录'},{id:'export',label:'📤 导出'}]
    .map(function(p){return '<button class="'+(currentPage===p.id?'active':'')+'" onclick="go(\''+p.id+'\')">'+p.label+'</button>'}).join('');
  var m=document.getElementById('main');
  if(currentPage==='add')renderAdd(m);
  else if(currentPage==='pool')renderPool(m);
  else if(currentPage==='all')renderAll(m);
  else renderExport(m);
}
function go(p){currentPage=p;editingCode=null;render()}

// ── 本地搜索（离线可用）──
function doSearch(){
  var q=document.getElementById('sQuery').value.trim().toLowerCase();
  if(!q)return;
  var res=document.getElementById('searchResult');
  var info=document.getElementById('companyInfo');
  res.innerHTML='<div class="search-results"><span class="loading"></span>搜索中...</div>';
  if(info)info.innerHTML='';
  
  // 从本地数据库匹配
  var results=[];
  if(typeof STOCK_DB!=='undefined'){
    for(var i=0;i<STOCK_DB.length;i++){
      var s=STOCK_DB[i];
      if(s.c.indexOf(q)===0||s.n.toLowerCase().indexOf(q)>=0){
        results.push(s);
        if(results.length>=20)break;
      }
    }
    // 拼音首字母模糊匹配（简单版）
    if(results.length<5){
      for(var i=0;i<STOCK_DB.length;i++){
        var s=STOCK_DB[i];
        if(s.c.toLowerCase().indexOf(q)>=0||s.n.indexOf(q)>=0){
          var exists=false;for(var j=0;j<results.length;j++){if(results[j].c===s.c){exists=true;break}}
        if(!exists){results.push(s);if(results.length>=20)break}
      }
    }
  }
  }
  if(!results.length){res.innerHTML='<div class="search-results">❌ 未找到匹配A股，请手动输入代码和名称</div>';return}
  res.innerHTML='<div class="search-results"><select id="sSel" onchange="onSelect()">'+
    results.map(function(r){return '<option value="'+r.c+'" data-name="'+r.n+'">'+r.c+' - '+r.n+'</option>'}).join('')+
    '</select></div>';
  onSelect();
}

function onSelect(){
  var sel=document.getElementById('sSel');if(!sel)return;
  var opt=sel.options[sel.selectedIndex];
  document.getElementById('sCode').value=opt.value;
  document.getElementById('sName').value=opt.getAttribute('data-name');
  loadProfile(opt.value);
}

// ── 公司简介：也用本地匹配（离线）──
function loadProfile(code){
  // 离线版暂不显示公司简介，后续可扩展
  var el=document.getElementById('companyInfo');if(el)el.innerHTML='';
}

// ── 新增/编辑 ──
function renderAdd(el){
  var comp=editingCode?loadData().find(function(c){return c.code===editingCode}):null;
  el.innerHTML='<div class="card"><h3 style="margin-bottom:16px">'+(comp?'✏️ 编辑公司':'📝 新增公司分析')+'</h3>'+
    '<div class="form-group"><label>🔍 搜索股票（代码/名称/拼音）</label><div class="search-row">'+
    '<input id="sQuery" placeholder="如 600519 / 贵州茅台 / gzmt">'+
    '<button onclick="doSearch()">查询</button></div></div>'+
    '<div id="searchResult"></div><div id="companyInfo"></div>'+
    '<div class="form-group"><label>股票代码</label><input id="sCode" placeholder="自动填充或手动输入" value="'+(comp?comp.code:'')+'" '+(comp?'disabled':'')+'></div>'+
    '<div class="form-group"><label>公司名称</label><input id="sName" placeholder="自动填充或手动输入" value="'+(comp?comp.name:'')+'"></div>'+
    '<div class="form-group"><label>分类</label><div style="display:flex;gap:8px">'+
    '<select id="sCat" style="flex:1">'+loadCats().map(function(c){return '<option'+(comp&&comp.category===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select>'+
    '<input id="sNewCat" placeholder="或输入新分类" style="flex:1"></div></div>'+
    '<div class="form-group"><label>📈 基本面分析</label><textarea id="sFund" placeholder="财务亮点、护城河、竞争优势..." rows="4">'+(comp?esc(comp.fundamental):'')+'</textarea></div>'+
    '<div class="form-group"><label>⚠️ 风险提示</label><textarea id="sRisk" placeholder="潜在雷区、行业风险..." rows="3">'+(comp?esc(comp.risk):'')+'</textarea></div>'+
    '<div class="form-group"><label>🎯 操作计划</label><textarea id="sPlan" placeholder="买入/卖出逻辑、目标价位..." rows="3">'+(comp?esc(comp.plan):'')+'</textarea></div>'+
    '<button class="btn btn-primary" onclick="saveCompany()">💾 保存分析</button></div>';
}

function saveCompany(){
  var code=document.getElementById('sCode').value.trim();
  var name=document.getElementById('sName').value.trim();
  var newCat=document.getElementById('sNewCat').value.trim();
  var category=newCat||document.getElementById('sCat').value;
  var fundamental=document.getElementById('sFund').value;
  var risk=document.getElementById('sRisk').value;
  var plan=document.getElementById('sPlan').value;
  if(!code||!name){alert('请填写股票代码和公司名称');return}
  if(newCat){var cats=loadCats();if(cats.indexOf(newCat)<0){cats.push(newCat);saveCats(cats)}}
  var data=loadData();
  var now=new Date().toLocaleString('zh-CN');
  var idx=-1;for(var i=0;i<data.length;i++){if(data[i].code===code){idx=i;break}}
  if(idx>=0){data[idx].name=name;data[idx].category=category;data[idx].fundamental=fundamental;data[idx].risk=risk;data[idx].plan=plan;data[idx].updatedAt=now}
  else{data.push({code:code,name:name,category:category,fundamental:fundamental,risk:risk,plan:plan,createdAt:now,updatedAt:now})}
  saveData(data);editingCode=null;alert('✅ 保存成功！');go('pool');
}

// ── 股票池 ──
function renderPool(el){
  var data=loadData();
  el.innerHTML='<div class="filters"><select id="filterCat" onchange="filterPool()">'+
    ['全部'].concat(loadCats()).map(function(c){return '<option>'+c+'</option>'}).join('')+
    '</select></div><div id="poolList"></div>';
  filterPool();
}
function filterPool(){
  var data=loadData();
  var fc=document.getElementById('filterCat').value;
  var filtered=fc==='全部'?data:data.filter(function(c){return c.category===fc});
  var list=document.getElementById('poolList');
  if(!filtered.length){list.innerHTML='<div class="empty"><div class="icon">📭</div><p>暂无记录</p></div>';return}
  list.innerHTML=filtered.map(function(c){return '<div class="card"><div class="card-header"><div>'+
    '<span class="card-title">'+esc(c.name)+'</span><span style="color:#888">('+c.code+')</span>'+
    '<span class="card-category">'+esc(c.category)+'</span></div>'+
    '<span class="card-meta">'+(c.updatedAt||'')+'</span></div>'+
    '<div class="actions">'+
    '<button class="btn btn-edit btn-sm" onclick="editingCode=\''+c.code+'\';currentPage=\'add\';render()">✏️ 编辑</button>'+
    '<button class="btn btn-danger btn-sm" onclick="delCompany(\''+c.code+'\')">🗑️ 删除</button>'+
    '<button class="btn btn-sm" style="background:#f0f2f5" onclick="toggleDetail(\''+c.code+'\')">📄 详情</button></div>'+
    '<div id="det_'+c.code+'" style="display:none;margin-top:12px">'+
    (c.fundamental?'<div class="detail-section"><h4>📈 基本面分析</h4><p>'+esc(c.fundamental)+'</p></div>':'')+
    (c.risk?'<div class="detail-section"><h4>⚠️ 风险提示</h4><p>'+esc(c.risk)+'</p></div>':'')+
    (c.plan?'<div class="detail-section"><h4>🎯 操作计划</h4><p>'+esc(c.plan)+'</p></div>':'')+
    '</div></div>'}).join('');
}
function toggleDetail(code){var el=document.getElementById('det_'+code);el.style.display=el.style.display==='none'?'block':'none'}
function delCompany(code){if(!confirm('确定删除？'))return;saveData(loadData().filter(function(c){return c.code!==code}));render()}

// ── 全部记录 ──
function renderAll(el){
  var data=loadData();
  if(!data.length){el.innerHTML='<div class="empty"><div class="icon">📋</div><p>暂无记录</p></div>';return}
  var cats={};data.forEach(function(c){cats[c.category]=1});
  el.innerHTML='<div class="stats"><div class="stat-card"><div class="stat-num">'+data.length+'</div><div class="stat-label">总数</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+Object.keys(cats).length+'</div><div class="stat-label">分类</div></div></div>'+
    '<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px">'+
    '<thead><tr style="background:#f8f9fa;text-align:left"><th style="padding:10px">代码</th><th style="padding:10px">名称</th><th style="padding:10px">分类</th><th style="padding:10px">更新时间</th></tr></thead>'+
    '<tbody>'+data.map(function(c){return '<tr style="border-top:1px solid #f0f0f0"><td style="padding:10px">'+c.code+'</td><td style="padding:10px">'+esc(c.name)+'</td>'+
    '<td style="padding:10px"><span class="badge badge-'+(CAT_COLORS[c.category]||'blue')+'">'+esc(c.category)+'</span></td>'+
    '<td style="padding:10px;color:#888;font-size:12px">'+(c.updatedAt||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}

// ── 导出 ──
function renderExport(el){
  var data=loadData();
  if(!data.length){el.innerHTML='<div class="empty"><div class="icon">📤</div><p>暂无数据</p></div>';return}
  var csv='\uFEFF代码,名称,分类,基本面分析,风险提示,操作计划,创建时间,更新时间\n';
  data.forEach(function(c){csv+=[c.code,c.name,c.category,'"'+(c.fundamental||'').replace(/"/g,'""')+'"','"'+(c.risk||'').replace(/"/g,'""')+'"','"'+(c.plan||'').replace(/"/g,'""')+'"',c.createdAt,c.updatedAt].join(',')+'\n'});
  el.innerHTML='<div class="card"><h3 style="margin-bottom:12px">📤 导出数据</h3><p style="margin-bottom:12px;color:#888">共 '+data.length+' 条记录</p>'+
    '<button class="btn btn-primary" onclick="dlCSV()">📥 导出 CSV</button></div>';
  window._csv=csv;
}
function dlCSV(){var b=new Blob([window._csv],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='stock_analysis.csv';a.click();URL.revokeObjectURL(u)}

render();
</script>
</body>
</html>
